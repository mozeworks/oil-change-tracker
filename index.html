<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oil Tracker">
<title>Oil Change Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app"></div>

<!-- Add / Edit car sheet -->
<div id="sheet-backdrop" class="backdrop hidden"></div>
<div id="car-sheet" class="sheet hidden">
  <div class="sheet-handle"></div>
  <form id="car-form">
    <h2 id="sheet-title">Add Car</h2>

    <label>Car name
      <input type="text" id="f-name" placeholder="e.g. Mom's Corolla" required>
    </label>

    <label>Make (optional, rough starting point)
      <select id="f-make">
        <option value="">— Select for a starting suggestion —</option>
      </select>
    </label>

    <div class="row">
      <label>Oil type
        <input type="text" id="f-oiltype" placeholder="e.g. Full Synthetic 5W-30">
      </label>
    </div>
    <p class="hint">Auto-fill is a rough starting point only — exact spec varies by year and engine. Check your owner's manual and correct if needed.</p>

    <div class="row2">
      <label>Manufacturer interval (mi)
        <input type="number" inputmode="numeric" id="f-mfginterval" placeholder="10000" required>
      </label>
      <label>Recommended interval (mi)
        <input type="number" inputmode="numeric" id="f-recinterval" placeholder="5000" required>
      </label>
    </div>
    <p class="hint" id="rec-hint">We suggest half the manufacturer interval for better engine life. Change is due at this mileage or 6 months, whichever comes first.</p>

    <div class="row2">
      <label>Last change date
        <input type="date" id="f-lastdate" required>
      </label>
      <label>Odometer at change (mi)
        <input type="number" inputmode="numeric" id="f-lastmiles" placeholder="45000" required>
      </label>
    </div>

    <div class="sheet-actions">
      <button type="button" id="btn-delete" class="btn btn-danger hidden">Delete</button>
      <button type="button" id="btn-cancel" class="btn btn-ghost">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>

<!-- Log oil change sheet -->
<div id="log-sheet" class="sheet hidden">
  <div class="sheet-handle"></div>
  <form id="log-form">
    <h2>Log Oil Change</h2>
    <p class="hint" id="log-car-name"></p>
    <label>Date changed
      <input type="date" id="l-date" required>
    </label>
    <label>Odometer (mi)
      <input type="number" inputmode="numeric" id="l-miles" required>
    </label>
    <div class="sheet-actions">
      <button type="button" id="log-cancel" class="btn btn-ghost">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>

<!-- History sheet -->
<div id="history-sheet" class="sheet hidden">
  <div class="sheet-handle"></div>
  <h2 id="history-car-name">History</h2>
  <div id="history-list" class="history-list"></div>
  <div class="sheet-actions">
    <button type="button" id="history-close" class="btn btn-ghost">Close</button>
  </div>
</div>

<script src="carsdata.js"></script>
<script src="app.js"></script>
</body>
</html>
